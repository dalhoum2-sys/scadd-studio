<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جولة مقترح العيادات في مستشفى الرياض</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav dark" id="nav" data-ia="navLabel">
  <div class="nav-in">
    <span class="brand" data-i="brand"></span>
    <div class="steps" id="steps"></div>
    <div class="lang" id="lang" role="group" data-ia="langLabel">
      <button type="button" data-l="ar" aria-pressed="true" lang="ar"><svg viewBox="0 0 30 20" aria-hidden="true" focusable="false"><rect width="30" height="20" fill="#006C35"/><text x="15" y="9.2" text-anchor="middle" font-size="4.4" fill="#fff" font-family="Thmanyah Sans,Tahoma,sans-serif">لا إله إلا الله محمد رسول الله</text><path d="M7.5 13.4h15" stroke="#fff" stroke-width=".9" stroke-linecap="round"/><path d="M21.2 12.2v2.4" stroke="#fff" stroke-width=".9" stroke-linecap="round"/></svg><span>العربية</span></button>
      <button type="button" data-l="en" aria-pressed="false" lang="en"><span>English</span></button>
    </div>
  </div>
</nav>
<main id="main">

<section class="page on" id="p1">
  <video id="vid" src="hospital.mp4" autoplay muted loop playsinline data-ia="p1vid"></video>
  <div class="scrim"></div>
  <div class="hero">
    <h1 class="rv" data-i="p1h1" data-h></h1>
    <p class="rv" style="--d:1" data-i="p1p"></p>
    <button class="btn light rv" style="--d:2" data-go="2" data-i="p1cta"></button>
    <div class="bn rv" style="--d:3" data-i="p1brand"></div>
  </div>
  <button class="btn glass sm snd" id="snd" aria-pressed="false"></button>
</section>

<section class="page" id="p2"><div class="wrap">
  <div class="eb rv" data-i="p2eb"></div>
  <h2 class="rv" style="--d:1" data-i="p2h"></h2>
  <p class="sub rv" style="--d:2" data-i="p2sub"></p>
  <div class="grid rv" style="--d:3">
    <div>
      <div class="mapbox"><img src="map_clean.png" alt="" data-ial="p2map"><canvas id="cv" role="img" data-ia="p2cv"></canvas><span class="tag" data-i="p2tag"></span></div>
      <section class="detail" id="detail" aria-live="polite" data-ia="detLabel"></section>
    </div>
    <div>
      <div class="lab" id="l-cl" data-i="lClin"></div>
      <div class="seg wr" id="clin" role="group" aria-labelledby="l-cl"></div>
      <div class="lab" id="l-sc" data-i="lScen"></div>
      <div class="seg" id="seg" role="group" aria-labelledby="l-sc"></div>
      <div class="lab" id="l-do" data-i="lDom"></div>
      <div class="doms" id="doms" role="group" aria-labelledby="l-do"></div>
      <div class="stats">
        <div class="stat"><b id="kids">—</b><span id="kidsl"></span></div>
        <div class="stat"><b id="cap">—</b><span id="capl"></span></div>
      </div>
      <div class="share"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="#E3EEEC" stroke-width="10"/><circle id="ring" cx="32" cy="32" r="26" fill="none" stroke="#B5472B" stroke-width="10" stroke-dasharray="0 163" transform="rotate(-90 32 32)"/></svg>
        <div style="flex:1"><label for="sh"><span data-i="shareLbl"></span>: <b id="shv" style="color:var(--acc)">2%</b> <span data-i="shareOf"></span></label><input id="sh" type="range" min="1" max="10" value="2"></div></div>
      <details class="basis" id="basis"><summary data-i="basisSum"></summary>
        <div class="bin"><label for="base" data-i="baseLbl"></label>
          <div class="brow"><input id="base" type="text" inputmode="numeric" autocomplete="off" value="801,500" aria-describedby="baseerr"><button type="button" class="btn ghost sm" id="basereset" data-i="baseReset"></button></div>
          <p id="baseerr" class="err" role="alert" hidden></p></div>
        <table class="bt"><caption data-i="baseCap"></caption><thead><tr><th scope="col" data-i="thBand"></th><th scope="col" data-i="thShare"></th><th scope="col" data-i="thNum"></th></tr></thead><tbody id="bt"></tbody></table>
        <p data-i="baseTxt"></p>
      </details>
      <ul class="note"><li data-i="n1" data-h></li><li data-i="n2" data-h></li><li data-i="n3" data-h></li></ul>
    </div>
  </div>
  <div class="pn"><button class="btn ghost" data-go="1" data-i="prev"></button><button class="btn" data-go="3" id="to3"></button></div>
</div></section>

<section class="page" id="p3"><div class="wrap">
  <div class="eb rv" data-i="p3eb"></div>
  <h2 class="rv" style="--d:1" data-i="p3h"></h2>
  <p class="sub rv" style="--d:2" data-i="p3sub"></p>
  <div class="fgrid rv" style="--d:3">
    <div>
      <div class="cases" id="cases" role="group" data-ia="p3cases"></div>
      <svg id="plan" viewBox="0 0 800 480" role="img" data-ia="p3plan"></svg>
      <p class="note1" data-i="p3note"></p>
    </div>
    <div>
      <div class="card sm" id="info"></div>
      <ol class="steps-l" id="steps3"></ol>
      <button class="btn ghost sm" id="replay" hidden style="margin-top:12px" data-i="p3replay"></button>
    </div>
  </div>
  <div class="pn"><button class="btn ghost" data-go="2" id="back3"></button><button class="btn" data-go="4" id="to4"></button></div>
</div></section>

<section class="page" id="p4"><div class="wrap">
  <div class="eb rv" data-i="p4eb"></div>
  <h2 class="rv" style="--d:1" data-i="p4h"></h2>
  <p class="sub rv" style="--d:2" data-i="p4sub"></p>
  <div class="brandcard rv" style="--d:3"><b data-i="brandT"></b><p data-i="brandP"></p></div>
  <div class="clin rv" style="--d:4" id="clin4" role="tablist" data-ia="clinics"></div>
  <article class="panel" id="panel" role="tabpanel"></article>
  <p class="note1" data-i="p4note"></p>
  <div class="pn"><button class="btn ghost" data-go="3" id="back4"></button><button class="btn" data-go="5" id="to5"></button></div>
</div></section>

<section class="page film-page" id="p5">
  <div class="film-wrap">
    <div class="film-box">
      <div class="stage"><video id="film" src="academy_film.mp4" muted playsinline preload="auto" data-ia="p5film"></video><div class="grad"></div><div class="ov" id="ov" aria-live="polite"></div></div>
      <div class="ov m" id="ovm" hidden></div>
    </div>
    <div class="cap5" id="cap5" aria-live="polite"></div>
    <div class="chbar" id="chbar" role="tablist" data-ia="chapters"></div>
    <div class="ctrl">
      <button class="btn sm" id="prv5"></button>
      <button class="btn sm pri" id="play5"></button>
      <button class="btn sm" id="cc5" aria-pressed="true"></button>
      <button class="btn sm" id="vo5" aria-pressed="true" hidden></button>
      <button class="btn sm" id="nxt5"></button>
    </div>
  </div>
</section>

<section class="page" id="p6"><div class="wrap">
  <div class="eb rv" data-i="p6eb"></div>
  <h2 class="rv" style="--d:1" data-i="p6h"></h2>
  <p class="sub rv" style="--d:2" data-i="p6sub"></p>
  <ol class="road rv" style="--d:3" id="road"></ol>
  <div class="pn"><button class="btn ghost" data-go="5" data-i="prev"></button></div>
  <p class="foot" data-i="footBrand"></p>
</div></section>
</main>
<script src="embed.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
